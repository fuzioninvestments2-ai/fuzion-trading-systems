# fuzion_fx/config/bots.yaml — Configuracion de los 4 bots Fuzion FX.
# Cada bot: su timeframe, sus 22 pares, indicadores, riesgo, aprendizaje y su
# sqlite propia. Los 4 comparten token y canal de Telegram (se resuelven de .env).

# MERCADO que se opera en Pocket Option. "real" = mercado real (EURUSD), que es
# lo que opera el usuario; "otc" = activos sinteticos de PO (EURUSD_otc). CRITICO:
# el precio real y el OTC son SERIES DISTINTAS. Si el colector se suscribe al
# activo equivocado, los niveles y el win/loss no coinciden con lo que el usuario
# ve en PO. Los pares se listan sin sufijo; el colector agrega "_otc" solo si
# market=otc.
market: real

# MOTOR de analisis (aplica a los 4 bots salvo que uno lo pise):
#   cuantico = 8 indicadores (RSI, MACD, Bollinger, EMA 9/21/55, Estocastico,
#     Donchian, VWAP, momentum) + arbitro ADX (Slide/Oscillate) + 5 patrones de
#     vela + convergencia de los 7 tiempos (1m-30m). Emite solo con veredicto
#     OPERAR (o OPCIONAL en modo rapido). Es la estrategia completa de Alex.
#   simple = motor de una sola tf (4 indicadores, votacion 2 de 4). El anterior.
motor: cuantico

# Filtro de PAGO (payout) real de Pocket Option, aplicado a los 4 bots. El usuario
# opera la banda 53%-92%: emite solo si el pago del activo esta en ese rango, y
# PRIORIZA el de mayor pago (scan_once ordena los pares por pago desc). require=true:
# si el colector aun no recibio el pago del par, NO se emite (mejor callar que a
# ciegas).
payout: {min_pct: 53, max_pct: 92, require: true}

# EMISION ORDENADA (de a una, global a los 4 bots): tras emitir una señal, NINGUN
# bot manda otra hasta que esa termine (vence) + este descanso. Asi las señales
# llegan de a una y con espacio, no en rafagas. 120 = 2 min de descanso: antes 600
# (10 min) dejaba todo mudo demasiado tiempo (con el candado global habia ~1 señal
# cada 10+ min entre los 4 bots). 2 min mantiene el espacio sin secar el flujo.
signal_cooldown_seconds: 60

bots:
  f1_m1:
    name: "FUZION FX 1M"
    timeframe: "1m"
    timeframe_seconds: 60
    card_label: "1 min - M1"
    # 8 pares LIQUIDOS (antes 22). PORQUE: el colector escucha de a UN par 8s (PO
    # transmite uno a la vez); con 22 la vuelta era 176s (~3 min) y cada par tenia
    # data fresca solo 8s de cada 3 min -> el analisis corria sobre velas viejas y
    # la señal demoraba. Con 8, la vuelta es 64s (~1 min): data fresca cada minuto,
    # que es lo que necesita el bot de 1m para engranar. Para agregar mas pares,
    # sumalos aca (cuesta velocidad: cada par extra suma 8s a la vuelta).
    pairs: [EUR/USD, GBP/USD, USD/JPY, AUD/USD, USD/CAD, USD/CHF, EUR/JPY, GBP/JPY]
    indicators: {ema_fast: 9, ema_slow: 21, rsi_period: 14, rsi_oversold: 40, rsi_overbought: 60, macd_fast: 12, macd_slow: 26, macd_signal: 9, bb_period: 20, bb_std: 2.0, atr_period: 14}
    signal: {min_confirmations: 2, max_signals_per_hour: 10}
    risk: {max_daily_trades_per_pair: 10, max_daily_loss_pct: 5.0, recovery_after_consecutive_losses: 3, news_buffer_minutes: 5, default_stake_pct: 1.0}
    learning: {min_trades_for_setup_evaluation: 10, discard_setup_below_win_pct: 40, prioritize_setup_above_win_pct: 70}
    checkpoint_offset: 20
    telegram_token: "${TELEGRAM_BOT_TOKEN}"
    db_path: "data/db/f1_memory.db"
    log_level: "INFO"
  f2_m2:
    name: "FUZION FX 2M"
    timeframe: "2m"
    timeframe_seconds: 120
    card_label: "2 min - M2"
    # 8 pares LIQUIDOS (antes 22). PORQUE: el colector escucha de a UN par 8s (PO
    # transmite uno a la vez); con 22 la vuelta era 176s (~3 min) y cada par tenia
    # data fresca solo 8s de cada 3 min -> el analisis corria sobre velas viejas y
    # la señal demoraba. Con 8, la vuelta es 64s (~1 min): data fresca cada minuto,
    # que es lo que necesita el bot de 1m para engranar. Para agregar mas pares,
    # sumalos aca (cuesta velocidad: cada par extra suma 8s a la vuelta).
    pairs: [EUR/USD, GBP/USD, USD/JPY, AUD/USD, USD/CAD, USD/CHF, EUR/JPY, GBP/JPY]
    indicators: {ema_fast: 9, ema_slow: 21, rsi_period: 14, rsi_oversold: 40, rsi_overbought: 60, macd_fast: 12, macd_slow: 26, macd_signal: 9, bb_period: 20, bb_std: 2.0, atr_period: 14}
    signal: {min_confirmations: 2, max_signals_per_hour: 8}
    risk: {max_daily_trades_per_pair: 10, max_daily_loss_pct: 5.0, recovery_after_consecutive_losses: 3, news_buffer_minutes: 5, default_stake_pct: 1.0}
    learning: {min_trades_for_setup_evaluation: 10, discard_setup_below_win_pct: 40, prioritize_setup_above_win_pct: 70}
    checkpoint_offset: 30
    telegram_token: "${TELEGRAM_BOT_TOKEN_2M}"
    db_path: "data/db/f2_memory.db"
    log_level: "INFO"
  f3_m3:
    name: "FUZION FX 3M"
    timeframe: "3m"
    timeframe_seconds: 180
    card_label: "3 min - M3"
    # Cuantico (hereda global). La reversion (hibrido) dispara demasiado poco en vivo
    # -> con el requisito de MAS señales, los 4 van en cuantico. El hibrido queda en
    # el codigo por si se retoma con foco en el borde (no en volumen).
    # 8 pares LIQUIDOS (antes 22). PORQUE: el colector escucha de a UN par 8s (PO
    # transmite uno a la vez); con 22 la vuelta era 176s (~3 min) y cada par tenia
    # data fresca solo 8s de cada 3 min -> el analisis corria sobre velas viejas y
    # la señal demoraba. Con 8, la vuelta es 64s (~1 min): data fresca cada minuto,
    # que es lo que necesita el bot de 1m para engranar. Para agregar mas pares,
    # sumalos aca (cuesta velocidad: cada par extra suma 8s a la vuelta).
    pairs: [EUR/USD, GBP/USD, USD/JPY, AUD/USD, USD/CAD, USD/CHF, EUR/JPY, GBP/JPY]
    indicators: {ema_fast: 9, ema_slow: 21, rsi_period: 14, rsi_oversold: 40, rsi_overbought: 60, macd_fast: 12, macd_slow: 26, macd_signal: 9, bb_period: 20, bb_std: 2.0, atr_period: 14}
    signal: {min_confirmations: 2, max_signals_per_hour: 6}
    risk: {max_daily_trades_per_pair: 8, max_daily_loss_pct: 4.0, recovery_after_consecutive_losses: 2, news_buffer_minutes: 5, default_stake_pct: 1.0}
    learning: {min_trades_for_setup_evaluation: 8, discard_setup_below_win_pct: 40, prioritize_setup_above_win_pct: 70}
    checkpoint_offset: 30
    telegram_token: "${TELEGRAM_BOT_TOKEN_3M}"
    db_path: "data/db/f3_memory.db"
    log_level: "INFO"
  f4_m5:
    name: "FUZION FX 5M"
    timeframe: "5m"
    timeframe_seconds: 300
    card_label: "5 min - M5"
    # Cuantico (hereda global). Ver nota en f3_m3.
    # 8 pares LIQUIDOS (antes 22). PORQUE: el colector escucha de a UN par 8s (PO
    # transmite uno a la vez); con 22 la vuelta era 176s (~3 min) y cada par tenia
    # data fresca solo 8s de cada 3 min -> el analisis corria sobre velas viejas y
    # la señal demoraba. Con 8, la vuelta es 64s (~1 min): data fresca cada minuto,
    # que es lo que necesita el bot de 1m para engranar. Para agregar mas pares,
    # sumalos aca (cuesta velocidad: cada par extra suma 8s a la vuelta).
    pairs: [EUR/USD, GBP/USD, USD/JPY, AUD/USD, USD/CAD, USD/CHF, EUR/JPY, GBP/JPY]
    # rsi 40/60 (como los otros 3): con la resolucion honesta ya activa (velas
    # reales de PO + liquidacion contra la vela operada), se afloja el RSI para que
    # emita sobre los pares con buen pago. El win-rate real se mide ahora sobre
    # datos limpios; si baja, se vuelve a subir el umbral.
    indicators: {ema_fast: 9, ema_slow: 21, rsi_period: 14, rsi_oversold: 40, rsi_overbought: 60, macd_fast: 12, macd_slow: 26, macd_signal: 9, bb_period: 20, bb_std: 2.0, atr_period: 14}
    # min_confirmations 2 (no 3 ni 4): el motor tiene SOLO 4 indicadores votantes,
    # 2 de tendencia (ema, macd) y 2 de reversion (rsi, bb), que se OPONEN en los
    # extremos. Medido sobre 360 patrones: con 3 confirmaciones emite el 0.6% (casi
    # mudo), con 4 el 0.0%, con 2 el 73%. Exigir 3+ era la razon real de "no llegan
    # senales". Con 2 (mayoria simple: 2 votos de un lado que superan al otro) el
    # pipeline fluye; el pre-filtro 10s, el pago 72-92% y el aprendizaje recortan
    # la calidad. Ver /tmp tasa de emision y test_integracion_e2e.
    signal: {min_confirmations: 2, max_signals_per_hour: 5}
    risk: {max_daily_trades_per_pair: 6, max_daily_loss_pct: 3.0, recovery_after_consecutive_losses: 2, news_buffer_minutes: 10, default_stake_pct: 1.0}
    learning: {min_trades_for_setup_evaluation: 6, discard_setup_below_win_pct: 45, prioritize_setup_above_win_pct: 75}
    checkpoint_offset: 30
    telegram_token: "${TELEGRAM_BOT_TOKEN_5M}"
    db_path: "data/db/f4_memory.db"
    log_level: "INFO"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  channel_id: "${TELEGRAM_CHANNEL_ID}"
